name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p solplay
        env:
          # Rust 1.95 emits LLVM 22 bitcode, while the macOS linker on GitHub
          # runners currently cannot link it when LTO is enabled.
          CARGO_PROFILE_RELEASE_LTO: "false"
      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -C target/release -czf "solplay-$TARGET.tar.gz" solplay
          shasum -a 256 "solplay-$TARGET.tar.gz" > "solplay-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            solplay-*.tar.gz
            solplay-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            solplay-*.tar.gz
            solplay-*.tar.gz.sha256
