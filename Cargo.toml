[workspace]
members = [
  "crates/solplay-core",
  "crates/solplay-rpc",
  "crates/solplay-delivery",
  "crates/solplay-storage",
  "crates/solplay-engine",
  "crates/solplay-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/solplay/solplay"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-pubkey = "4.2.1"
solana-rpc-client = "4.2.2"
solana-rpc-client-api = "4.2.2"
spl-token-2022-interface = "3.1.1"
spl-token-interface = "3.0.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
